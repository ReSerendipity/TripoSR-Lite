[package]
name = "triposr-lite-desktop"
version = "0.1.0"
description = "TripoSR-Lite 桌面应用壳（Tauri v2）"
authors = ["ReSerendipity"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "TripoSR-Lite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = { version = "0.4", features = ["std", "alloc"] }
chrono = "0.4"
